<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard RH</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="NovaQuest.png" type="image/x-icon">
</head>
<body>
  <div class="container">
    <div class="navigation">
      <ul>
        <li class="brand">
          <span class="logo"><img src="NovaQuest.png" alt="agences de voyages logo"></span>
          <span class="titre"><h2>NovaQuest</h2></span>
        </li>
        <li>
          <a href="#apercu"><span>Page principale</span></a>
        </li>
        <li>
          <a href="#employes">Employés</a>
        </li>
        <li>
          <a href="#conges">Congés</a>
        </li>
        <li>
          <a href="#taches">Taches</a>
        </li>
        <li>
          <a href="#performance">Performances</a>
        </li>
      </ul>
    </div>
    <div class="main">
      <div class="topbar">
        <div class="menu-toggle" role="button" aria-label="Toggle navigation">
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </div>
        <div class="header">
          <h1>Agence de Voyages-Dashbord RH</h1>
          <p class="sous-titre">Gestion des employés-Suivi des congés, des taches et des performances</p>
        </div>
        <div class="search-bar">
          <label>
            <input type="text" placeholder="rechercher ici">
            <i class="fa fa-search" aria-hidden="true"></i>
          </label>
        </div>
      </div>

      <div id="cards-container" class="cards-grid">
        <!--cards dynamiques-->
      </div>
      <section id="apercu" class="section">
        <div class="charts-grid">
          <div class="chart-box">
            <canvas id="chart-apercu"></canvas>
          </div>
        </div>
      </section>
      <section id="employes" class="section">
        <div class="charts-grid">
          <div class="chart-box">
            <canvas id="chart-employes"></canvas>
          </div>
        </div>
      </section>
      <section id="conges" class="section">
        <div class="charts-grid">
          <div class="chart-box">
            <canvas id="chart-conges"></canvas>
          </div>
        </div>
      </section>
      <section id="taches" class="section">
        <div class="charts-grid">
          <div class="chart-box">
            <canvas id="chart-taches"></canvas>
          </div>
        </div>
      </section>
      <section id="performance" class="section">
        <div class="charts-grid">
          <div class="chart-box">
            <canvas id="chart-performance"></canvas>
          </div>
        </div>
      </section>
    </div>
  </div>
  
  

  <script src="data.js"></script>
    <!-- Chart.js UMD build -->
  <script src="chart.umd.js"></script>

  <!-- Ton script personnalisé -->
  <script src="script.js"></script>

    
</body>
</html>
